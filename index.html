:root{--ink:#1B2320;--paper:#EDF1EB;--hi:#FFD23F;--bi:#F3F5EF;--mute:rgba(27,35,32,.7);--rule:rgba(27,35,32,.18);--tube:#FCFDFB;--spo2:#7BD3F0;color-scheme:light}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;-webkit-text-size-adjust:100%}
body{font:16px/1.42 Bric,"Helvetica Neue",Arial,sans-serif;font-feature-settings:"kern" 1;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
sub{font-size:.66em;line-height:0;vertical-align:-.22em}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#paper,#band{display:flex;flex-direction:column;min-height:0}

/* header: scene number (opens the list of scenes), name, about; the scene's steps underneath */
#head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 8px;padding:calc(env(safe-area-inset-top) + 6px) 8px 7px 10px;flex:none}
#menu{height:44px;min-width:44px;border:0;background:none;display:flex;align-items:center;gap:7px;padding:0 6px;border-radius:10px}
#menu .lst{width:22px;height:22px;flex:none}
#menu.x #num{display:none}
#num{display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border:2px solid var(--ink);border-radius:8px;font-weight:700;font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
#name{margin:0;font-size:20px;line-height:1.1;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%}
#info svg{width:25px;height:25px}
#prog{grid-column:1/4;display:flex;gap:4px;padding:0 8px}
#prog i{flex:1;height:3px;border-radius:2px;background:rgba(27,35,32,.15)}
#prog i.done{background:rgba(27,35,32,.5)}
#prog i.cur{background:var(--ink)}

/* picture */
#pic{position:relative;flex:none;overflow:hidden}
#cv{position:absolute;left:0;top:0;display:block}
.nopic #pic{display:none}

/* monitor */
#mon{background:#000;color:var(--bi);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0 10px;padding:7px 18px 8px;flex:none}
.nomon #mon{display:none}
.ro{display:flex;flex-direction:column;justify-content:flex-end;transition:opacity .4s}
.ro .rl{font-size:13px;line-height:1.2;color:rgba(243,245,239,.74);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro .rv{white-space:nowrap;line-height:1;font-weight:700;font-size:25px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--bi)}
.ro .rv small{font-size:13px;font-weight:400;letter-spacing:0;color:rgba(243,245,239,.74);margin-left:3px}
.ro.big .rv{font-size:29px}
#mon.n4 .ro .rv{font-size:22px}#mon.n4 .ro.big .rv{font-size:25px}#mon.n4{gap:0 6px;padding-left:14px;padding-right:14px;grid-auto-columns:minmax(max-content,1fr)}

/* blood gas slip */
#abg{flex:none;padding:0 10px}
#abg:not(.on){display:none}
.slip{background:#FBFBF5;color:var(--ink);padding:9px 14px 16px;box-shadow:0 1px 0 rgba(27,35,32,.12),0 6px 14px -8px rgba(27,35,32,.4);clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),96% 100%,92% calc(100% - 6px),88% 100%,84% calc(100% - 6px),80% 100%,76% calc(100% - 6px),72% 100%,68% calc(100% - 6px),64% 100%,60% calc(100% - 6px),56% 100%,52% calc(100% - 6px),48% 100%,44% calc(100% - 6px),40% 100%,36% calc(100% - 6px),32% 100%,28% calc(100% - 6px),24% 100%,20% calc(100% - 6px),16% 100%,12% calc(100% - 6px),8% 100%,4% calc(100% - 6px),0 100%)}
.slip .sh{font-weight:700;font-size:14px;margin-bottom:2px}
.slip .rows{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px 6px}
.slip .row{grid-column:span 3;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:3px}
.slip .row:nth-child(5){grid-column:span 2}
.slip .row:nth-child(6),.slip .row:nth-child(7){grid-column:span 5}
.slip .row:nth-child(8),.slip .row:nth-child(9){grid-column:span 6}
.slip .rl{flex:0 0 100%;font-size:13px;line-height:1.25;color:var(--mute);white-space:nowrap}
.slip .rv{font-weight:700;font-size:16px;line-height:1.25;font-variant-numeric:tabular-nums;padding:0 3px;margin-left:-3px;border-radius:4px}
.slip .ru{font-size:13px;color:var(--mute)}
.slip .flag .rv{background:var(--hi)}

/* words */
#txt{flex:0 1 auto;min-height:0;overflow-y:auto;padding:12px 18px 6px;-webkit-overflow-scrolling:touch}
#txt.more,#scr.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 34px),transparent);mask-image:linear-gradient(#000 calc(100% - 34px),transparent)}
.say{margin:0;font-size:16.5px;line-height:1.42;max-width:66ch}
.sl-mega{font-weight:700;font-size:40px;line-height:.98;letter-spacing:-.035em;margin:2px 0 10px}
.sl-sub{font-size:18px;line-height:1.25;margin:0 0 10px}
.sl-eq{display:inline-block;font-weight:700;font-size:22px;letter-spacing:-.01em;background:var(--tube);border:2px solid var(--ink);border-radius:8px;padding:5px 12px 6px;margin:0 0 10px}
.cred{font-size:14px;margin:0 0 10px;color:var(--mute)}
.refs{margin-top:10px;columns:1}
.refs p{margin:0 0 6px;padding-left:14px;text-indent:-14px;font-size:14px;line-height:1.3}
.refs a.rf{display:flex;align-items:center;gap:10px;min-height:44px;padding:5px 0;border-bottom:1px solid var(--rule);color:inherit;text-decoration:none;break-inside:avoid;-webkit-column-break-inside:avoid}
.refs .rt{flex:1 1 auto;font-size:14px;line-height:1.3;padding-left:14px;text-indent:-14px;overflow-wrap:break-word}
.refs .rm{flex:none;display:flex;align-items:center;gap:7px}
.refs .rm .tag{margin:0}
.refs .rm svg{width:17px;height:17px;opacity:.75}
.refs a.rf:active{background:var(--hi)}
.refs a.rf:focus-visible{outline:3px solid var(--ink);outline-offset:-2px;border-radius:4px}
@media (hover:hover){.refs a.rf:hover .rt{text-decoration:underline;text-underline-offset:3px}}
.tag{display:inline-block;background:var(--hi);font-weight:700;font-size:14px;line-height:1;padding:4px 8px 5px;border-radius:4px;margin-right:2px;vertical-align:1px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;max-width:560px}
.opt{display:flex;align-items:center;gap:10px;min-height:50px;padding:7px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--tube);text-align:left;font-size:16.5px;line-height:1.15}
.opt b{font-weight:700;font-size:17px}
.opt:active{background:var(--hi)}
.opt:focus-visible,#next:focus-visible,#back:focus-visible,#info:focus-visible,#menu:focus-visible,input:focus-visible{outline:3px solid #2F86A8;outline-offset:2px}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 9px}
.verdict .ans{background:var(--hi);font-weight:700;font-size:16px;line-height:1;padding:7px 11px 8px;border-radius:6px;white-space:nowrap}
.verdict .ans b{margin-right:7px}
.verdict .you{font-size:14px;color:var(--mute)}
.verdict .you.ok{color:var(--ink);font-weight:700}

/* sliders */
#ctl{flex:none;padding:2px 18px 0}
#ctl:not(.on){display:none}
.sl+.sl{margin-top:2px}
.slh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slh label{flex:1 1 0;min-width:0;font-size:15px}
.slh output{flex:none;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:0;background:transparent;touch-action:pan-y;--tr:rgba(27,35,32,.22);--fl:var(--ink)}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fl) var(--v,50%),var(--tr) var(--v,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--tr)}
input[type=range]::-moz-range-progress{height:4px;background:var(--fl)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-13px;border-radius:50%;background:var(--hi);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--hi);border:2px solid var(--ink)}

/* Back and Next */
#fill{flex:1 1 0;min-height:0}
#nav{display:flex;gap:10px;padding:6px 14px max(10px,env(safe-area-inset-bottom));flex:none}
#back,#next{height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
#back{width:56px;border:2px solid var(--rule);background:transparent}
#back:disabled{opacity:.35;cursor:default}
#next{flex:1;border:0;background:var(--ink);color:var(--bi);font-weight:700;font-size:17px}
#back svg,#next svg{width:20px;height:20px}
#next span,#prac{white-space:nowrap}
#prac{height:52px;flex:none;padding:0 14px;border:2px solid var(--rule);border-radius:12px;background:transparent;color:inherit;font-weight:700;font-size:15.5px}
#prac:active{background:var(--hi)}
#pracs .card{gap:8px}
#pracl{display:flex;flex-direction:column;gap:8px;margin:2px 0 8px;overflow-y:auto}
.pr{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:9px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--tube);color:var(--ink);text-align:left}
.pr b{font-size:17px;line-height:1.2}
.pr span{font-size:14.5px;line-height:1.3;color:var(--mute)}
.pr[aria-current]{background:var(--hi)}
#pracx{width:100%;height:48px;border:0;border-radius:12px;background:var(--ink);color:var(--bi);font-weight:700;font-size:16px;margin-top:4px;flex:none}
@media (max-width:400px){#next{font-size:16px}#next svg{display:none}#prac{padding:0 11px;font-size:15px}#nav{gap:8px}}

@media (max-width:679px) and (max-height:700px){
 #head{padding-top:calc(env(safe-area-inset-top) + 2px);padding-bottom:4px}#name{font-size:18px}
 .say{font-size:15.5px;line-height:1.36}#txt{padding-top:8px}
 .ro .rv{font-size:22px}.ro.big .rv{font-size:25px}#mon{padding:5px 18px 6px}
 .opt{min-height:46px;font-size:15.5px}#back,#next,#prac{height:48px}
}

/* phone: one column; the picture height is set so the longest step of the scene still fits */
.phone #paper,.phone #band{display:contents}
.phone #head{order:1}.phone #pic{order:2;height:var(--pich,40vh)}.phone #mon{order:3}.phone #abg{order:4;margin-top:-1px}.phone #txt{order:5}.phone #ctl{order:6}.phone #fill{order:7}.phone #nav{order:8}
.phone.nomon #abg{margin-top:8px}
#scr{display:none}
#app.short #scr{display:block;order:4;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#app.short #txt{overflow:visible;flex:none}
#app.short #fill{display:none}

/* the black band of the lecture, for iPads and wide windows */
.tall #band,.wide #band{background:#000;color:var(--bi);padding:20px 24px max(18px,env(safe-area-inset-bottom))}
.tall #mon,.wide #mon{display:block;padding:0;background:none}
#app.tall #mon{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:row;gap:0 18px}
.tall .ro.big{grid-column:1/3}
.tall .ro,.wide .ro{flex-direction:row;justify-content:space-between;align-items:baseline;border-bottom:2px solid rgba(243,245,239,.22);padding:10px 0 9px;gap:10px}
.tall .ro:not(.big){flex-direction:column;align-items:flex-start;justify-content:flex-end}
.tall .ro .rl,.wide .ro .rl{font-size:17px}
.tall .ro .rv,.wide .ro .rv{font-size:44px}
.tall .ro:not(.big) .rv{font-size:38px}
.tall .ro .rv small,.wide .ro .rv small{font-size:16px;margin-left:6px}
.tall .ro.big .rv,.wide .ro.big .rv{font-size:72px}
.tall #abg,.wide #abg{padding:16px 0 0}
.wide .slip{transform:rotate(-.8deg);padding:12px 16px 20px}
.wide .slip .sh{font-size:16px;margin-bottom:6px}
.wide .slip .rows{grid-template-columns:1fr;gap:0}
.wide .slip .row{grid-column:auto!important;display:grid;grid-template-columns:minmax(0,1fr) auto 44px;align-items:baseline;gap:6px;font-size:15px;line-height:1.55}
.wide .slip .rl{font-size:15px;color:var(--ink);white-space:normal}
.wide .slip .rv{font-size:16px;text-align:right;margin-left:0}
.wide .slip .row.cut{border-top:1.5px solid var(--rule);margin-top:4px;padding-top:4px}
.wide .slip .ru{font-size:14px}
.tall #ctl,.wide #ctl{padding:16px 0 0}
.tall .slh label,.wide .slh label{font-size:16px;color:rgba(243,245,239,.86)}
.tall .slh output,.wide .slh output{font-size:22px}
.tall input[type=range],.wide input[type=range]{--tr:rgba(243,245,239,.3);--fl:var(--bi)}
.tall #nav,.wide #nav{padding:16px 0 0}
.tall #back,.wide #back,.tall #prac,.wide #prac{border-color:rgba(243,245,239,.35);color:var(--bi)}
.tall #next,.wide #next{background:var(--bi);color:var(--ink)}
.tall #name,.wide #name{font-size:28px}
.tall #head,.wide #head{padding:calc(env(safe-area-inset-top) + 14px) 18px 12px 20px}
.tall #num,.wide #num{min-width:36px;height:36px;font-size:17px}
.tall .say{font-size:19px;line-height:1.46}
.wide .say{font-size:clamp(19px,1.25vw,22px);line-height:1.46}
.tall .sl-mega,.wide .sl-mega{font-size:64px}
.tall .opt,.wide .opt{font-size:18px;min-height:56px}
.tall .tag,.wide .tag{font-size:15px}
.tall .verdict .ans,.wide .verdict .ans{font-size:18px}
.tall .verdict .you,.wide .verdict .you{font-size:16px}
.tall .refs,.wide .refs{columns:280px 2;column-gap:28px}
.tall .refs p,.wide .refs p,.tall .refs .rt,.wide .refs .rt{font-size:15px}

/* iPad upright: picture across the top, words beside the band */
#app.tall{display:grid;grid-template-columns:minmax(0,1fr) var(--bw);grid-template-rows:auto minmax(0,1fr) var(--both,auto);grid-template-areas:"head head" "pic pic" "txt band"}
.tall #paper{display:contents}
.tall #head{grid-area:head}.tall #pic{grid-area:pic;height:auto}.tall #txt{grid-area:txt;padding:22px 30px 18px}.tall #band{grid-area:band}
#app.tall.nopic{grid-template-rows:auto 0 minmax(0,1fr)}

/* wide: the lecture's composition, paper on the left and the band on the right */
#app.wide{display:grid;grid-template-columns:minmax(0,1fr) var(--bw);grid-template-areas:"paper band"}
.wide #paper{grid-area:paper}.wide #band{grid-area:band;padding-top:calc(env(safe-area-inset-top) + 22px)}
.wide #pic{flex:1 1 auto;height:auto;min-height:0}
.wide #txt{flex:none;height:var(--txth,auto);padding:14px 32px 22px}
.wide.nopic #txt{flex:1 1 auto;height:auto}

/* measuring every step's natural height */
.meas #txt{height:auto!important;flex:none!important;overflow:visible!important;align-self:start}
.meas #band{height:auto!important;align-self:start}
#app.meas.tall{grid-template-rows:auto 200px auto}
.meas .slip,.meas .say{animation:none!important}

/* motion */
#txt.in .say,#txt.in .opts,#txt.in .verdict{animation:rise .32s ease-out both}
#abg.on .slip{animation:print .7s ease-out both}
html.qc *{animation:none!important;transition:none!important}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes print{from{clip-path:inset(0 0 100% 0)}}
.tall #abg.on .slip,.wide #abg.on .slip{animation:none}
@media (prefers-reduced-motion:reduce){#txt.in .say,#txt.in .opts,#txt.in .verdict,#abg.on .slip{animation:none}}

/* sheets: about this scene, and the list of scenes */
.sheet{position:fixed;inset:0;background:rgba(27,35,32,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:5}
.sheet[hidden]{display:none}
.sheet .card{background:var(--paper);border-radius:16px;padding:20px 20px 16px;max-width:460px;width:100%;margin-bottom:env(safe-area-inset-bottom);max-height:calc(100% - 20px);display:flex;flex-direction:column}
.sheet h2{margin:0 0 8px;font-size:22px;line-height:1.1}
.sheet p{margin:0 0 12px;font-size:15px}
.sheet .cred{font-size:14px;color:var(--ink)}
.sheet .src{color:var(--mute);font-size:14px}
#scenes{list-style:none;margin:0 -8px 8px;padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#scenes button{width:100%;min-height:44px;border:0;background:none;display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;padding:6px 8px;border-radius:8px}
#scenes button span{min-width:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute)}
#scenes button[aria-current]{background:var(--hi);font-weight:700}
#scenes button[aria-current] span{color:var(--ink)}
#close,#shut{width:100%;height:48px;border:0;border-radius:12px;background:var(--ink);color:var(--bi);font-weight:700;font-size:16px;margin-top:4px;flex:none}
@media (min-width:680px){.sheet{align-items:center}}

/* practise screens: chips, the case options, the lung lab's sliders, the blood gas reader, the follow-up questions */
.xrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
.xrow.col{flex-direction:column;align-items:stretch;max-width:420px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 16px;border:2px solid var(--ink);border-radius:22px;background:var(--tube);color:var(--ink);font-weight:700;font-size:15px;line-height:1.15;text-align:center}
.chip:active{background:var(--hi)}
.chip svg{width:18px;height:18px;flex:none}
.chip.ret{margin:0 0 10px;padding-left:10px}
.prac{margin-top:12px;padding-top:10px;border-top:2px solid var(--rule)}
.prac-h{margin:0;font-weight:700;font-size:16px}
.prac .xrow{margin-top:6px}
.opts.x5 .opt:last-child{grid-column:1/-1}
.xline{font-size:15.5px;margin-top:6px}
#app[data-x="lab"] #ctl.on{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
#app[data-x="lab"] .sl+.sl{margin-top:0}
.gin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin:2px 0 10px;max-width:460px}
.gf span{display:block;font-size:14px;line-height:1.3;margin-bottom:3px}
.gf input{display:block;width:100%;height:46px;padding:0 12px;border:2px solid var(--ink);border-radius:10px;background:var(--tube);color:var(--ink);font:inherit;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.gf input::-webkit-inner-spin-button,.gf input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.seg{display:flex;gap:8px;margin:0 0 10px;max-width:460px}
.seg button{flex:1 1 0;min-height:44px;border:2px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:4px 8px;line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bi)}
.fu-h{margin:0 0 6px;font-size:14px;color:var(--mute)}
.fu-q{color:var(--mute)}
.fu-a{margin-top:10px}
#scenes .grp{list-style:none;font-weight:700;font-size:16px;padding:12px 8px 4px}
#scenes .grp:first-child{padding-top:2px}
.tall .chip,.wide .chip{font-size:16px}
.tall .xline,.wide .xline{font-size:17px}
#app.nomon #mon{display:none}
#app[data-x="lab"].tall .slh label,#app[data-x="lab"].wide .slh label{font-size:15px}
#app[data-x="lab"].tall .slh output,#app[data-x="lab"].wide .slh output{font-size:17px}
</style></head>
<body>
<div id="app">
 <div id="paper">
  <header id="head">
   <button id="menu" aria-label="Contents"><svg class="lst" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg><span id="num">1</span></button>
   <h1 id="name">Air meets blood</h1>
   <button id="info" aria-label="About this scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 11v6" stroke-linecap="round"/><circle cx="12" cy="7.3" r="1.3" fill="currentColor" stroke="none"/></svg></button>
   <div id="prog" role="progressbar"></div>

<script>window.SCRIPT={"title": ["Welcome. For the next hour we are going to follow air until it meets blood, because almost everything you do with an airway and a ventilator comes down to that meeting. What you see on the screen is a working model of a lung. The blood changes colour as it picks up oxygen, and every number on the monitor is calculated from the lung beside it."], "deal": ["This is how the hour works. Before each answer appears I will put a question on the screen with its options. Pick one in your head and commit to it before I move on. There are fourteen questions, nobody is keeping score, and a wrong pick teaches you more than no pick.", "There is evidence behind asking you to do this. In an introductory physics course, students who only watched a demonstration understood it no better than students who never saw it. The students who predicted the result first understood more."], "part1": ["We start with six things you need before ventilation and perfusion make sense: pressure and its units, the oxygen cascade, the alveolar gas equation, haemoglobin, carbon dioxide, and the volume the lung rests at. This part takes about twenty minutes."], "baro": ["The air above us has weight, about ten tonnes on every square metre, and that weight is barometric pressure. In this barometer the air presses on the dish and holds the mercury up in the tube. At sea level the column stands 760 millimetres tall, and that height is all that mmHg means.", "The SI unit is the kilopascal. The same sea-level pressure is 101.3 kPa, so one kPa is 7.5 mmHg. Every number today is in mmHg, so if you trained in kPa, multiply by 7.5.", "First question. A blood gas reports a PaO<sub>2</sub> of 13.3 kPa. What is that in mmHg? Pick one.", "It is 100 mmHg, which is 13.3 times 7.5. Keep three more pairs in your head. A PaCO<sub>2</sub> of 5.3 kPa is 40 mmHg, a PaO<sub>2</sub> of 8 kPa is 60, and the water vapour pressure of 6.3 kPa is 47.", "One more idea before we leave the barometer. Each gas in a mixture exerts its own share of the total pressure. Air is 21% oxygen, so in dry air at sea level oxygen exerts 21% of 760, which is 160 mmHg, or 21 kPa. That 160 is the top of the cascade on the next screen.", "The slider converts any pressure for you. Try 60, and then 47."], "cascade": ["Oxygen starts at 160 mmHg in dry air and ends at a few mmHg in the mitochondria, and it loses pressure at every step on the way. Here is the first question on that journey. If dry air holds oxygen at 160, what is the PO<sub>2</sub> in the alveolus?", "The first loss happens in the nose and trachea. The gas is warmed and saturated with water, and water vapour at body temperature takes 47 mmHg of the total. Oxygen is 21% of the 713 that remains, which is 150.", "In the alveolus the answer is 100. Carbon dioxide arrives from the blood and oxygen leaves into it, and the alveolar gas equation gives 150 minus 40 over 0.8. We will take that equation apart in a few minutes.", "From alveolus to artery the blood should lose almost nothing, about 5 mmHg in a healthy young adult. That step is the A–a difference, and you can work it out from every blood gas: the alveolar PO<sub>2</sub> from the equation, minus the PaO<sub>2</sub>. When it is larger, air and blood are poorly matched somewhere in the lung, and finding out where is most of this hour.", "The tissues take their oxygen from the capillaries, so mixed venous blood comes back at about 40 mmHg. The mitochondria at the end of the line work at only a few mmHg, which is why the pressure higher up matters so much."], "topo": ["Every number so far belongs to sea level, and we do not work at sea level. Here is the peninsula from west to east, as a contour map on top and a slice through the ground below it. We start on the Red Sea coast at Jeddah, where the barometer reads 760.", "Watch the monitor as we travel east. Up the escarpment to Taif, at nearly 1,900 metres, the barometer falls to about 605. Then we come down onto the Najd plateau and stop in Riyadh, about 600 metres above the sea, where it reads about 707 mmHg, or 94 kPa. The inspired PO<sub>2</sub> here is 139, where it was 150 on the coast.", "You can drag the marker across the country yourself. The higher the ground, the lower the barometer, and the less oxygen pressure there is to start the cascade."], "cascadeR": ["So this is the cascade you and your patients live with. From dry air to arterial blood, each step is about 11 mmHg lower than at sea level: 149 in dry air, 139 in the airway, 89 in the alveolus and 84 in the artery. That arterial blood is still 96% saturated, and the haemoglobin curve in a few minutes will show why so small a loss does not matter in health."], "alvgas": ["The alveolar gas equation is a subtraction, so I have written it as one. Oxygen arrives in the airway at 150. The blood removes some, and what is left is the alveolar PO<sub>2</sub>. We cannot measure the oxygen removed directly, but the blood returns 8 molecules of CO<sub>2</sub> for every 10 of oxygen it takes, so the oxygen removed is the PaCO<sub>2</sub> divided by 0.8. Forty over 0.8 is 50, and 150 minus 50 leaves 100.", "Now use it. A patient breathing air hypoventilates until the PaCO<sub>2</sub> is 80. What is the alveolar PO<sub>2</sub>?", "Fifty. Halve the ventilation and the same oxygen uptake comes out of half as much gas, so the amount removed doubles to 100, and 150 minus 100 leaves 50. Look at the oximeter: 76%. That is lower than you would read off the standard dissociation curve at 50 mmHg, because a PaCO<sub>2</sub> of 80 makes the blood acidotic and shifts the curve to the right.", "Now give 30% oxygen and leave the ventilation alone. Oxygen arriving rises to 214, the alveolar PO<sub>2</sub> is 114, and the saturation is back to 97% with the PaCO<sub>2</sub> still at 80. A little supplemental oxygen hides hypoventilation from the oximeter, and the blood gas on the slip shows what it hides: a PaCO<sub>2</sub> of 80 and a pH of 7.08. Its A–a difference is 0, because the lung itself is working and the problem is ventilation. This model lung is ideal; in a healthy young adult the A–a difference would be about 5. When Fu and colleagues halved the ventilation of 45 anaesthetised patients, the saturation fell only in those breathing air.", "Change the PaCO<sub>2</sub> and the inspired oxygen yourself. Try a PaCO<sub>2</sub> of 60 on air."], "odc": ["This is how much oxygen 100 mL of blood carries at each PO<sub>2</sub>. The dot is arterial blood breathing air: 100 mmHg and about 20 mL. Now the question. On oxygen the PaO<sub>2</sub> rises from 100 to 500. How much more oxygen does the blood carry?", "About a tenth more. It is 8%, from 20 to 21.6 mL. By 100 mmHg haemoglobin is 98% full, so five times the pressure only adds the small amount that dissolves in plasma. Remember this flat top, because the whole story of shunt depends on it.", "Now come down the curve. At 60 mmHg the blood is still 91% saturated and has lost little. This flat part is your safety margin, and it is why living in Riyadh costs a healthy person almost nothing.", "At 40, the PO<sub>2</sub> of mixed venous blood, it is still three-quarters full. The tissues have taken only a quarter of what the blood carried.", "Half the oxygen has gone by 27 mmHg, which is the P50. Below 60 the curve is steep, so every mmHg lost now costs a lot of oxygen. An oximeter falling through the 80s is a patient on this slope.", "Slide the PO<sub>2</sub> along the curve and watch the saturation and the content together."], "co2": ["Carbon dioxide next. The PaCO<sub>2</sub> is set by one thing you control, the alveolar ventilation. The dot is a normal adult, with about 4.3 litres a minute and a PaCO<sub>2</sub> of 40. If you halve the alveolar ventilation, what happens to the PaCO<sub>2</sub>?", "It doubles. The PaCO<sub>2</sub> equals CO<sub>2</sub> production divided by alveolar ventilation, times a constant, so the relationship is this curve. Halve the ventilation and the PaCO<sub>2</sub> is 80, which is the hypoventilating patient from the alveolar gas equation.", "Here is the difference between the two gases in blood. The points marked a and v are arterial and mixed venous blood. The oxygen curve flattens once haemoglobin is full, and the CO<sub>2</sub> curve keeps climbing through the whole working range. So a well-ventilated alveolus can unload extra CO<sub>2</sub>, and it cannot load extra oxygen. Hold on to that, because it explains why a patient with a mismatched lung is hypoxic with a normal PaCO<sub>2</sub>."], "frc": ["The last piece of the primer is the volume the lung rests at. This is quiet breathing in a young adult who is awake. Each breath ends at the functional residual capacity, which is above the closing capacity, the volume at which small airways start to close. Now a question about what anaesthesia does. During general anaesthesia, how many adults show collapsed lung on CT?", "Before the answer, watch the trace. Induction lowers FRC by about a fifth. Tidal breathing now dips below closing capacity, and in the shaded part of every breath small airways are shut, so the alveoli behind them get blood and little fresh gas.", "The answer is nearly nine in ten. Of 109 adults scanned during anaesthesia, 95 had collapsed lung in the dependent regions, and in an earlier series it was there within five minutes of induction in all 20 patients. The dependent lung is compressed, loses its gas and collapses. On the CT slice the arrows mark it: the pale band along the back of both lungs.", "In infants the fall is larger still. In 14 anaesthetised infants, paralysis took the FRC from 21 to 12 mL/kg, and only 3 centimetres of water of PEEP brought it back. That is the physiological case for PEEP in a paralysed infant."], "part2": ["That is the primer. Everything from here is about one idea. Every alveolus receives some gas and some blood, and how well it exchanges gas depends on the ratio of the two. We will build it up from a single alveolus."], "unit": ["Here is one alveolus with its capillary. At rest about 4.4 litres of fresh gas meet 5 litres of blood every minute, a ratio of 0.9. The alveolar PO<sub>2</sub> is about 100, the PCO<sub>2</sub> is 40, and the blood leaves 98% saturated. The graph on the right will plot the gas in this alveolus, with oxygen across and carbon dioxide up.", "Now I am going to block the airway to this alveolus and leave the blood flowing. What is the PO<sub>2</sub> of the blood that leaves?", "Forty. With no fresh gas the alveolus settles at the gas tensions of the venous blood flowing past it, so the blood leaves exactly as it arrived. That is a shunt: blood that goes through the lung and meets no gas.", "Now the opposite. I restore the ventilation and stop the blood. Nothing is exchanged, so the alveolus fills with inspired gas, with a PO<sub>2</sub> of 150 and no CO<sub>2</sub> at all. That ventilation is wasted, and we call it dead space.", "Every alveolus in the lung lies somewhere on this line between those two extremes, and one number, its V/Q ratio, decides where. Slide it and watch the gas and the blood change together."], "upright": ["A real lung has millions of these units, and they do not all get the same share. This is the upright lung cut into nine slices from apex to base, as John West measured it in 1962. First a question. In a healthy upright lung, where is the alveolar PO<sub>2</sub> highest?", "Blood flow first. It rises about eighteen-fold from the top slice to the bottom.", "Ventilation rises towards the base as well, but only about three-fold.", "So the ratio falls from above 3 at the apex to 0.6 at the base, and the alveolar PO<sub>2</sub> falls with it, from 132 to 87. The answer is the apex. It has the best gas in the lung and almost no blood to carry it away.", "Most of the blood comes through the base, so the mixed arterial PO<sub>2</sub> is close to the value at the base: 94. Even a perfectly healthy lung loses a few mmHg to this unevenness."], "zones": ["Why does the top get so little blood? Pressure in the pulmonary arteries and veins falls by 1 centimetre of water for every centimetre you climb above the heart, while the pressure in the alveoli is the same everywhere. On the right are those three pressures plotted against height. Where the venous line is below the alveolar line the alveoli partly squeeze the vessels, and that is zone 2. Lower down both vascular pressures are above alveolar pressure and the vessels are held open, which is zone 3.", "Now make it an anaesthetic. The pulmonary artery pressure falls, as it can after induction or with bleeding, and you add PEEP. What happens at the top of the lung?", "Blood flow stops. At the top the alveolar pressure is now higher than the arterial pressure, so the capillaries are squeezed shut. That lung is still ventilated and has no blood flow. It is alveolar dead space, and you created it with the ventilator and the blood pressure.", "A word of caution about this picture. Gravity explains only part of the uneven flow. The branching pattern of the airways and vessels accounts for much of it, and you can find high-flow and low-flow regions within a single horizontal slice.", "Change the alveolar pressure and the arterial pressure, and watch zone 1 appear and disappear."], "table": ["Now lay the patient down. This is a CT slice through the lower chest of a supine patient who is awake, with the front at the top and the patient's right on your left, as on every CT. The dependent lung at the back gets most of the blood, and awake it also gets most of the gas, so the two are well matched. Now anaesthetise, paralyse and ventilate this patient. Where does the gas go?", "Mostly to the front. The paralysed diaphragm no longer pulls on the dependent lung, and the ventilator pushes gas to where the lung is easiest to move. The blood stays at the back, where the lung is now collapsing. On the CT, the collapse is the pale band growing along the back of both lungs. Gas at the front and blood at the back is mismatch, and it began at induction.", "This has been measured. In 35 anaesthetised adults the amount of shunt followed the amount of atelectasis, and the amount of low V/Q followed airway closure. Together those two explained three-quarters of the fall in PaO<sub>2</sub>. So the anaesthetised lung has two separate problems, and the next scenes take them one at a time."], "shunt": ["Here are two units side by side. The upper one takes 30% of the blood and the lower one 70%, and each gets the gas it needs. The blood leaves red, and the monitor shows a PaO<sub>2</sub> of about 100 and a saturation of 98%.", "Now the upper unit collapses, which is what atelectasis is. The CT in the corner shows the same collapse in a patient, the pale crescents along the back of both lungs. Its blood arrives on the other side as dark as it left the heart, and mixes with the red blood from the open unit. The PaO<sub>2</sub> falls to 55 and the saturation to 88%.", "You do what everyone does and turn the oxygen up to 100%. What is the PaO<sub>2</sub> now?", "About 100. Look at the open alveolus. Its PO<sub>2</sub> is now over 600, but its blood was already full, so the extra pressure adds almost nothing, and the shunted blood never meets the oxygen at all. A PaO<sub>2</sub> of 104 on 100% oxygen, when a healthy lung would give more than 600, is the signature of shunt.", "Make the shunt 50%, and 100% oxygen leaves the PaO<sub>2</sub> at 51. Here is the blood gas: FiO<sub>2</sub> 1.0, PaO<sub>2</sub> 51, and an A–a difference of 604. Beyond a certain size of shunt, oxygen is no longer a treatment.", "Change the shunt and the inspired oxygen yourself."], "isoshunt": ["This is the same idea drawn as a map. Inspired oxygen runs across and PaO<sub>2</sub> runs up. The line is a lung with no shunt, where the PaO<sub>2</sub> climbs in step with the oxygen you give. The yellow dot is our last patient, on air with a 30% shunt.", "Each new line is a fixed shunt. At 10% oxygen still works well. By 30% the line is almost flat.", "Take our patient from air to 100% oxygen and the dot slides along the 30% line, from 55 to 104. These are the iso-shunt lines that Benatar, Hewlett and Nunn published in 1973. At the bedside you can read them backwards: if you know the inspired oxygen and the PaO<sub>2</sub>, you can estimate the shunt. And the treatment for a large shunt is to reopen lung, because oxygen has little left to offer.", "Move along a line with the oxygen, and between lines with the shunt."], "lowvq": ["Back to two open units, each matched to its blood. This graph plots the PaO<sub>2</sub> against the inspired oxygen, and the purple line is the 30% shunt from the last scene.", "This time one unit does not collapse. Its airway narrows, as it does when FRC falls below closing capacity, and the alveolus stays open with only 6% of the gas its blood needs. The PaO<sub>2</sub> is 58, and the dot is almost on the shunt line. On air you cannot tell the two apart.", "So here is the test. The alveolus is open this time. On 60% oxygen, what is the PaO<sub>2</sub>?", "Above 100. It is 114, where the shunt would have given 72. An open alveolus uses whatever oxygen reaches it, so low V/Q responds to a modest rise in inspired oxygen and shunt does not. That is how you tell them apart.", "Now go all the way to 100% oxygen and keep your eye on the PaO<sub>2</sub>. It climbs past 500, and then the unit collapses and it falls to 104. On air, nitrogen held this alveolus open, because blood does not absorb it. On pure oxygen the blood takes up the gas faster than the narrow airway delivers it, so the alveolus empties. Low V/Q has become shunt, and the oxygen did it. The blood gas now reads like shunt: a PaO<sub>2</sub> of 104 on 100% oxygen and an A–a difference of 554.", "This is absorption atelectasis, and it has been measured. After induction on 100% oxygen there were 4.2 square centimetres of atelectasis on CT, against 0.2 on 30% oxygen. And of nine healthy subjects who had no shunt breathing air, eight developed one on pure oxygen.", "Narrow the airway and change the oxygen yourself."], "co2spare": ["One more puzzle before the capnograph. These are the two blood curves from the primer, oxygen on the left and carbon dioxide on the right. Two matched units each receive half the blood, and the yellow dot is the mixed arterial blood.", "One unit becomes poorly ventilated. Its dots slide down the oxygen curve and up the CO<sub>2</sub> line, and its blood now carries about 13 mL of oxygen against a normal 20. Blood from the two units mixes by content, so the mix lands halfway between them. On the CO<sub>2</sub> line, halfway is a PaCO<sub>2</sub> of 44. On the oxygen curve, the halfway content falls on the steep part, and the PaO<sub>2</sub> drops to 46.", "The patient responds by breathing harder, and the extra ventilation goes to the good unit. Which arterial gas returns to normal?", "Carbon dioxide. About an eighth more ventilation brings the PaCO<sub>2</sub> back to 40, and the PaO<sub>2</sub> does not move from 46.", "The curves show why. The well-ventilated unit slides down the CO<sub>2</sub> line, its blood gives up more CO<sub>2</sub>, about 44 mL against a normal 47, and the mix comes back to 40. On the oxygen curve the same unit is already at the flat top and cannot carry more. So the good unit can make up for the bad unit's CO<sub>2</sub> and not for its oxygen. That is why V/Q mismatch gives you hypoxaemia with a normal PaCO<sub>2</sub>."], "deadspace": ["Now the other end of the V/Q line, and a monitor you watch all day. This is the last 40 seconds of the capnograph, with the arterial PCO<sub>2</sub> from the blood gas as the red dashed line. With two matched units, the end-tidal CO<sub>2</sub> and the arterial PCO<sub>2</sub> are both 40.", "Here is the question. The ventilation is unchanged, and within a minute the end-tidal CO<sub>2</sub> falls from 40 to 25. What has changed?", "Less blood is reaching the lung. I have stopped the blood flow to one of the two units. Its gas comes back exactly as it went in, with no CO<sub>2</sub> in it, and dilutes every breath, so the end-tidal falls to 25 while the arterial PCO<sub>2</sub> has hardly moved. A sudden fall in end-tidal CO<sub>2</sub> with unchanged ventilation means a fall in pulmonary blood flow until proved otherwise: low cardiac output, an embolus or cardiac arrest.", "Now leave the ventilator alone for a few minutes. The body is still making CO<sub>2</sub> and only 60% of the ventilation is clearing it, so the arterial PCO<sub>2</sub> climbs to 67. As it climbs, the end-tidal drifts back up to 40. A normal end-tidal number can hide a large problem. Take a blood gas: the PaCO<sub>2</sub> is 67 against an end-tidal of 40, a difference of 27, and the A–a difference is 0. That arterial to end-tidal difference is the CO<sub>2</sub> partner of the A–a difference, and it measures alveolar dead space.", "You change dead space with every anaesthetic. After induction and intubation the anatomical dead space falls, because the tube bypasses the upper airway, and the alveolar dead space rises."], "hpv": ["The lung has a defence against all this. Here is one-lung ventilation on 100% oxygen. The lung on the left of the picture is ventilated, and the one on the right is blocked and has collapsed. If the blood stayed evenly split between the two lungs, half of it would be shunted and the PaO<sub>2</sub> would be about 50.", "It does not stay split. Vessels in hypoxic lung constrict and divert blood to the lung that is ventilated. Watch the artery to the collapsed lung narrow. Here the shunt has halved to 25% and the PaO<sub>2</sub> has trebled to 158. This is hypoxic pulmonary vasoconstriction, and it is working for you in every thoracic case.", "You will be asked what your drugs do to this reflex. Volatile agents blunt it in a dose-dependent way. Even so, in clinical one-lung ventilation the choice of anaesthetic has not been shown to change oxygenation.", "Change how much blood still reaches the unventilated lung."], "drive": ["Let us put the hour together. Here are three units in one lung, all matched. When the saturation falls in theatre, ask three questions in this order.", "First, is the alveolar PO<sub>2</sub> low? Check the inspired oxygen and the PaCO<sub>2</sub>. This is the alveolar gas equation, and it rules out hypoventilation and a wrong gas mixture before you blame the lung. Then subtract the PaO<sub>2</sub>: that is the A–a difference. At each fault a blood gas slip comes up, so you can read both differences.", "Second, does oxygen correct it? Here the top unit has collapsed, a third of the blood passes it unchanged, and the saturation is 86%. The blood gas shows a PaO<sub>2</sub> of 52 on air and an A–a difference of 44, while the CO<sub>2</sub> difference is only 3.", "On 100% oxygen the saturation recovers to 96%, which looks reassuring. But the PaO<sub>2</sub> is 86 when a matched lung would give over 600, and the A–a difference on the new gas is 572. That gap tells you blood is passing collapsed lung, and the answer is to reopen it. If a modest rise in oxygen had corrected the PaO<sub>2</sub>, you would be dealing with low V/Q.", "Third, has a gap opened between the arterial and the end-tidal CO<sub>2</sub>? Here blood has stopped reaching the bottom unit. The PaCO<sub>2</sub> is 60 and the end-tidal is 40, a difference of 20, and the A–a difference is back to 0, so the low PaO<sub>2</sub> comes from the raised PaCO<sub>2</sub> alone. Gas is reaching lung that blood is not, and the problem is in the circulation.", "The three sliders are the three faults. Set any patient you like and read the monitor."], "redraw": ["Before you leave, two minutes of work, because it is the part you will keep. On any piece of paper, and without looking at the screen, draw two units with one of them shunted, and then both dissociation curves, oxygen and carbon dioxide.", "There is a reason for making you do that. Forty residents were taught two topics. On one they took repeated short tests with feedback, and on the other they re-read a review sheet. Six months later they scored 39% on the tested topic and 26% on the other. So you will get three short questions from me by email, in two days, two weeks and six weeks."], "refs": ["These are the sources for everything you saw. Thank you. I am happy to take questions."]};window.CROPS={"title": [0, 488, 1920, 910], "deal": [1176, 234, 1816, 732], "part1": [0, 866, 1920, 910], "baro": [134, 148, 1256, 848], "cascade": [96, 356, 1824, 860], "topo": [88, 140, 1256, 842], "cascadeR": [96, 248, 1824, 860], "alvgas": [98, 204, 1228, 776], "odc": [146, 158, 1202, 826], "co2": [130, 158, 1202, 826], "frc": [184, 392, 1822, 862], "part2": [0, 564, 1920, 910], "unit": [0, 154, 1300, 830], "upright": [108, 342, 1798, 860], "zones": [108, 158, 1228, 834], "table": [416, 352, 1528, 862], "shunt": [0, 104, 1300, 830], "isoshunt": [130, 160, 1204, 826], "lowvq": [130, 160, 1224, 846], "co2spare": [94, 164, 1244, 850], "deadspace": [124, 196, 1234, 786], "hpv": [96, 124, 1248, 808], "drive": [0, 154, 1300, 810], "redraw": [1168, 226, 1760, 976], "refs": null};window.SLIPS={"alvgas": [3, 3], "shunt": [4, 4], "lowvq": [4, 4], "deadspace": [3, 3], "drive": [2, 4]};window.GROW={"deadspace": [0, 0, 0, 150], "co2spare": [0, -80, 0, 25], "odc": [-25, 0, 0, 0], "co2": [-25, 0, 0, 0], "cascade": [0, 0, 0, 80], "cascadeR": [0, 0, 0, 80], "baro": [0, -50, 0, 60], "topo": [-50, -60, 30, 40], "table": [-50, 0, 30, 0], "zones": [0, 0, 50, 20], "isoshunt": [-40, -60, 45, 25], "lowvq": [-25, 0, 0, 25]};window.PCROP={"upright": [80, 280, 1260, 980], "frc": [150, 355, 1480, 1375], "alvgas": [60, 180, 1262, 705]};window.REFS_ADDED=["Morris, Young, Thomas. BJA Educ 2025;25:90", "Pippalapalli, Lumb. BJA Educ 2023;23:221", "Dunn, Mythen, Grocott. BJA Educ 2016;16:341", "Cruickshank, Hirsch <script>/* Drawing kit for the "Air meets blood" app.
   The lecture's matching machine (src/stage.js), drawn into a picture box of any size.
   Every stroke, cell and gap scales with G.k; text sizes are set by the scene, never below 13 px. */
(function () {
  'use strict';
  var C = {
    paper: '#EDF1EB', ink: '#1B2320', mute: 'rgba(27,35,32,.68)', rule: 'rgba(27,35,32,.2)',
    tube: '#FCFDFB', air: '#8CC9E0', airD: '#2F86A8', hi: '#FFD23F', band: '#000000', bandInk: '#F3F5EF',
    spo2: '#7BD3F0', co2: '#FFE27A'
  };
  var g = null, REC = null, LAYER = 'all';   // REC: label boxes for the QC gate; LAYER: 'all', 'shapes' or 'text'

  function hex(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  var B0 = hex('#3B103C'), B1 = hex('#8F1532'), B2 = hex('#E5222B');
  function bloodRGB(S) {
    var t = Math.max(0, Math.min(1, (S - 0.5) / 0.5)); t = t * t;
    return t < 0.5 ? mix(B0, B1, t * 2) : mix(B1, B2, t * 2 - 1);
  }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

  /* canvas text with subscripts: "PO_2" */
  function measure(s, size, b) {
    var parts = String(s).split(/(_\d)/), w = 0, i, f = (b ? 700 : 400) + ' ' + size + 'px Bric', fs = (b ? 700 : 400) + ' ' + Math.round(size * 0.62) + 'px Bric';
    for (i = 0; i < parts.length; i++) { g.font = /^_\d$/.test(parts[i]) ? fs : f; w += g.measureText(parts[i].replace('_', '')).width; }
    return w;
  }
  function ct(s, x, y, size, o) {
    o = o || {};
    var w = measure(s, size, o.b), x0 = o.al === 'c' ? x - w / 2 : o.al === 'r' ? x - w : x;
    if (REC && !o.noRec) REC.push({ s: String(s).replace(/_(\d)/g, '$1'), x0: x0, y0: y - size * 0.78, x1: x0 + w, y1: y + size * 0.24, fs: size, inside: o.inside || null, grp: o.grp || null });
    if (LAYER === 'shapes') return w;
    var parts = String(s).split(/(_\d)/), i, f = (o.b ? 700 : 400) + ' ' + size + 'px Bric', fs = (o.b ? 700 : 400) + ' ' + Math.round(size * 0.62) + 'px Bric';
    g.fillStyle = o.col || C.ink; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
    for (i = 0; i < parts.length; i++) {
      var sub = /^_\d$/.test(parts[i]), str = parts[i].replace('_', '');
      g.font = sub ? fs : f; g.fillText(str, x0, y + (sub ? size * 0.18 : 0)); x0 += g.measureText(str).width;
    }
    return w;
  }
  function shapes() { return LAYER !== 'text'; }

  /* paths */
  function mkPath(pts, rad) {
    var out = [], i, k;
    function push(x, y) { out.push([x, y]); }
    for (i = 0; i < pts.length; i++) {
      var p = pts[i];
      if (i === 0 || i === pts.length - 1 || !rad) { push(p[0], p[1]); continue; }
      var a = pts[i - 1], b = pts[i + 1];
      var la = Math.hypot(p[0] - a[0], p[1] - a[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]), r = Math.min(rad, la / 2, lb / 2);
      var s = [p[0] - (p[0] - a[0]) / la * r, p[1] - (p[1] - a[1]) / la * r], e = [p[0] + (b[0] - p[0]) / lb * r, p[1] + (b[1] - p[1]) / lb * r];
      for (k = 0; k <= 10; k++) { var t = k / 10, u = 1 - t; push(u * u * s[0] + 2 * u * t * p[0] + t * t * e[0], u * u * s[1] + 2 * u * t * p[1] + t * t * e[1]); }
    }
    var len = [0];
    for (i = 1; i < out.length; i++) len.push(len[i - 1] + Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]));

    while (hi - lo > 1) { var m = (lo + hi) >> 1; if (len[m] <= s) lo = m; else hi = m; }

    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }
  function trace(path) { g.beginPath(); g.moveTo(path.p[0][0], path.p[0][1]); for (var i = 1; i < path.p.length; i++) g.lineTo(path.p[i][0], path.p[i][1]); }

  /* the matching machine: units in parallel between a split at xL and a merge at xR.
     lay: {x0, x1, lanes: [y...], xL, xR, xm, R, k}   */
  function geo(lay) {
    var n = lay.lanes.length, k = lay.k, sub = 24 * k, yc = (lay.lanes[0] + lay.lanes[n - 1]) / 2, paths = [], i;
    for (i = 0; i < n; i++) {
      var off = (i - (n - 1) / 2) * sub;
      paths.push(mkPath([[lay.x0, yc + off], [lay.xL, yc + off], [lay.xL, lay.lanes[i]], [lay.xR, lay.lanes[i]], [lay.xR, yc + off], [lay.x1, yc + off]], 26 * k));
    }
    return { n: n, R: lay.R, stem: lay.R * 0.5, lanes: lay.lanes, yc: yc, xL: lay.xL, xR: lay.xR, xm: lay.xm, sub: sub, k: k, paths: paths, x0: lay.x0, x1: lay.x1, ph: new Array(n).fill(0) };
  }
  function tubeW(G, q) { return G.k * (18 + 22 * Math.sqrt(clamp(q * G.n / 1.6, 0.05, 1.6))); }
  function trunkW(G) { return G.n * G.sub + 14 * G.k; }
  function inkW(G) { return Math.max(3, 8 * G.k); }
  function alvAt(G, i, q, col) {          // where unit i's alveolus is drawn: {x, y, R}
    var R = G.R * (1 - 0.62 * (col || 0)), tw = tubeW(G, q);
    return { x: G.xm, y: G.lanes[i] - tw / 2 - 4 * G.k - R, R: R, tw: tw };
  }
  /* us: per unit {q, vent, S, po2, col, lab}; o: {fsNum, fsSub, fsLab} */
  function machine(G, us, mixS, venS, e, o) {
    var n = G.n, i, k = G.k, tw = [];
    for (i = 0; i < n; i++) tw.push(tubeW(G, us[i].q));
    var tW = trunkW(G), ink = inkW(G);
    function strokes(dark) {
      g.lineCap = 'butt'; g.lineJoin = 'round';
      g.strokeStyle = dark ? C.ink : C.tube; g.lineWidth = tW + (dark ? ink : 0);
      g.beginPath(); g.moveTo(G.x0, G.yc); g.lineTo(G.xL + 10 * k, G.yc); g.moveTo(G.xR - 10 * k, G.yc); g.lineTo(G.x1, G.yc); g.stroke();
      for (var j = 0; j < n; j++) { g.strokeStyle = dark ? C.ink : C.tube; g.lineWidth = tw[j] + (dark ? ink : 0); trace(G.paths[j]); g.stroke(); }
    }
    if (shapes()) { strokes(true); strokes(false); }
    var cr = Math.max(2.6, 8.5 * k), sp = Math.max(9, 26 * k);
    for (i = 0; i < n; i++) {
      var u = us[i], P = G.paths[i], speed = Math.max(48, 150 * k) * clamp(u.q * n, 0, 3);
      G.ph[i] = e.qc ? 0 : (G.ph[i] + speed * e.dt) % sp;
      var cnt = Math.floor(P.L / sp) + 1, kk;
      var endRGB = bloodRGB(u.S), venRGB = bloodRGB(venS), mixRGB = bloodRGB(mixS), al = clamp(u.q * n / 0.12, 0, 1), zone = G.R * 0.8;
      if (!shapes()) continue;
      for (kk = 0; kk < cnt; kk++) {
        var s = kk * sp + G.ph[i]; if (s > P.L) continue;
        var pt = at(P, s), x = pt[0], y = pt[1], c, onLane = Math.abs(y - G.lanes[i]) < 2;
        if (x < G.xm - zone || (!onLane && x < G.xm)) c = venRGB;
        else if (x <= G.xm + zone && onLane) c = mix(venRGB, endRGB, ease((x - (G.xm - zone)) / (2 * zone)));
        else if (x < G.xR + 30 * k) c = endRGB;
        else c = mix(endRGB, mixRGB, ease((x - G.xR - 30 * k) / (120 * k)));
        g.fillStyle = rgb(c, al); g.beginPath(); g.arc(x, y, cr, 0, 6.2832); g.fill();
      }
    }
    for (i = 0; i < n; i++) {
      var v = us[i], col = v.col || 0, A = alvAt(G, i, v.q, col), R = Math.max(2, A.R), ax = A.x, ay = A.y;
      var br = (e.qc ? 0.6 : Math.sin(e.t * 1.57)) * 0.035 * clamp(v.vent, 0, 1.6) * (1 - col);
      R *= 1 + br;
      var sw = clamp(G.R * 0.5 * (0.35 + 0.65 * clamp(v.vent, 0, 1.3)) * (1 - 0.7 * col), 9 * k, G.R * 0.75), top = ay - R - G.stem * (1 - 0.45 * col);
      var tint = v.po2 ? clamp(v.po2 / 160, 0.12, 1) : 0.1;
      var fill = col > 0.5 ? rgb(mix(hex('#D9DEDA'), hex('#AEB6B1'), col)) : rgb(mix(hex('#EEF3F1'), hex('#9AD3E8'), tint));
      if (shapes()) {
        g.lineJoin = 'round'; g.lineWidth = Math.max(2, 4 * k); g.strokeStyle = C.ink; g.fillStyle = fill;
        g.beginPath(); g.rect(ax - sw / 2, top, sw, ay - top); g.fill();
        g.beginPath(); g.moveTo(ax - sw / 2, ay - R * 0.9); g.lineTo(ax - sw / 2, top); g.moveTo(ax + sw / 2, top); g.lineTo(ax + sw / 2, ay - R * 0.9); g.stroke();
        g.beginPath(); g.arc(ax, ay, R, 0, 6.2832); g.fill();
        var th = Math.asin(clamp(sw / 2 / R, 0, 1));
        g.beginPath(); g.arc(ax, ay, R, -1.5708 + th, 4.7124 - th); g.stroke();
        if (col > 0.5) {
          g.save(); g.beginPath(); g.arc(ax, ay, R - 2, 0, 6.2832); g.clip(); g.strokeStyle = 'rgba(27,35,32,.5)'; g.lineWidth = Math.max(1.2, 2 * k);
          var hs = Math.max(4, 9 * k);
          for (var hx = -R * 2; hx < R * 2; hx += hs) { g.beginPath(); g.moveTo(ax + hx, ay + R); g.lineTo(ax + hx + R, ay - R); g.stroke(); }
          g.restore();
        } else if (v.vent > 0.03) {
          var ph = e.qc ? 0.3 : (e.t * 0.25) % 1, dots = 3;
          for (var d = 0; d < dots; d++) {
            var yy = top + 6 * k + ((d / dots + ph) % 1) * (ay - R * 0.5 - top);
            g.fillStyle = rgb(hex(C.airD), 0.55 * clamp(v.vent, 0.2, 1)); g.beginPath(); g.arc(ax + (d % 2 ? 1 : -1) * sw * 0.16, yy, Math.min(5 * Math.max(k, 0.5), sw * 0.16), 0, 6.2832); g.fill();
          }
        }
      }
      if (col < 0.5 && v.po2) {
        var big = o.fsNum, ny = ay + big * 0.22;
        if (o.fsSub) ny -= o.fsSub * 0.42;
        ct(String(Math.round(v.po2)), ax, ny, big, { b: 1, al: 'c', inside: { x: ax, y: ay, R: R } });
        if (o.fsSub) ct('PO_2', ax, ny + o.fsSub * 1.12, o.fsSub, { al: 'c', col: C.mute, inside: { x: ax, y: ay, R: R } });
      }
    }
  }

  /* the simulated CT slice, with a pointer to each dependent crescent */
  function ctArrow(x, y, len, s) {
    var hw = 11 * s, hl = 17 * s, sw = 4 * s;
    g.save(); g.beginPath(); g.moveTo(x, y); g.lineTo(x - hw, y - hl); g.lineTo(x - sw, y - hl); g.lineTo(x - sw, y - len); g.lineTo(x + sw, y - len); g.lineTo(x + sw, y - hl); g.lineTo(x + hw, y - hl); g.closePath();
    g.fillStyle = C.hi; g.fill(); g.lineJoin = 'round'; g.lineWidth = Math.max(1.2, 2.5 * s); g.strokeStyle = C.ink; g.stroke(); g.restore();
  }

  window.KIT = {
    C: C, use: function (ctx) { g = ctx; }, ctx: function () { return g; },
    rec: function (a) { REC = a; }, layer: function (l) { LAYER = l || 'all'; }, shapes: shapes,
    hex: hex, mix: mix, rgb: rgb, bloodRGB: bloodRGB, blood: function (S, a) { return rgb(bloodRGB(S), a); },
    clamp: clamp, lerp: lerp, ease: ease, ct: ct, measure: measure,
    mkPath: mkPath, at: at, trace: trace, geo: geo, machine: machine, tubeW: tubeW, trunkW: trunkW, inkW: inkW, alvAt: alvAt, ctArrow: ctArrow
  };
})();
</script>
<script>/* Lung gas-exchange engine for "Air meets blood".
   Steady-state V/Q compartments with mixed-venous feedback.
   O2 curve: Severinghaus 1979 (J Appl Physiol 46:599) with Kelman 1966 virtual PO2 (Bohr shift).
   CO2 content: Douglas, Jones & Reed 1988 (J Appl Physiol 65:473).
   Mass balance per unit after West 1969 (Respir Physiol 7:88): O2, CO2 and N2. */
(function (root) {
  'use strict';

        (f.ans ? '<p class="say fu-a"><b>Answer.</b> ' + sub(f.q[1]) + '</p><div class="xrow"><button class="chip" data-see="' + f.q[2] + '" data-step="' + f.q[3] + '">See it in scene ' + (sc.i + 1) + ', ' + sc.name + '</button></div>' : '');
    },
    bind: function (el, X) {
      [].forEach.call(el.querySelectorAll('[data-set]'), function (b) { b.addEventListener('click', function () { X.go(1 + 6 * +b.getAttribute('data-set')); }); });
      [].forEach.call(el.querySelectorAll('[data-see]'), function (b) { b.addEventListener('click', function () { X.see(b.getAttribute('data-see'), +b.getAttribute('data-step'), 'the questions'); }); });
    },
    nextLabel: function (s) { if (s === 0) return 'First set'; var f = fuAt(s); return !f.ans ? 'Show the answer' : f.j < 2 ? 'Next question' : f.k < 2 ? 'Next set' : 'Done'; },
    onNext: function (s, X) { if (s < FS.length - 1) X.go(s + 1); else X.back(); }
  });
})();
</script>
<script>if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('400 16px Bric'), document.fonts.load('700 16px Bric')]).then(SCENES_BOOT, SCENES_BOOT); else SCENES_BOOT();</script>
